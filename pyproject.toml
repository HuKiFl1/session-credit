[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-credit"
version = "0.0.1"
description = "Agent-to-agent credit for one pinned FLOP inference session"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
